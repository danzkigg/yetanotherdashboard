# config.yml.example - Default configuration for YAD
settings:
  - Dashboard:
      name: "YAD - Yet Another Dashboard"
      width: "narrow"
      health-check: true

layout:
  - "Services":
      style: "row"
      columns: 2
      groups: ["Services"]
  
  - "Bookmarks":
      style: "row"
      columns: 1
      groups: ["Bookmarks"]

services:
  Services:
    - Pulse:
        icon: "di:pulse"
        url: "http://192.168.1.9:7655"
        description: "Proxmox Monitoring"
        widgets:
           - type: "pulse"
             url: "http://192.168.1.9:7655"
             apiToken: "APIKEY"
             # Alternative: username/password auth
             # username: "username"
             # password: "password"
          
            # Optional settings
             skipTLSVerify: false
             refreshInterval: 15000  # 15 seconds
             # Display options
             status: "all"           # all, running, stopped
             vm: true               # Show VMs
             lxc: true              # Show LXC containers
             showNodes: true        # Show node information
             showMetrics: true      # Show cluster metrics

bookmarks:
  Bookmarks:
    - GitHub:
        icon: "si:github"
        url: "https://github.com/danzkigg/yetanotherdashboard"
    
    - Docker Hub:
        icon: "si:docker"
        url: "https://hub.docker.com"